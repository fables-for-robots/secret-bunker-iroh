apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bunkersecrets.bunker.fables-for-robots.ch
spec:
  group: bunker.fables-for-robots.ch
  names:
    kind: BunkerSecret
    plural: bunkersecrets
    shortNames:
    - bs
    singular: bunkersecret
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.target.name
      name: Target
      type: string
    - jsonPath: .status.lastSyncTime
      name: LastSync
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Syncs secrets from a secret-bunker into one Kubernetes Secret
        properties:
          spec:
            properties:
              data:
                description: Explicit per-key mappings; highest precedence.
                items:
                  properties:
                    remoteRef:
                      properties:
                        group:
                          type: string
                        name:
                          type: string
                        property:
                          description: RFC 6901 JSON Pointer into a JSON-valued secret.
                          nullable: true
                          type: string
                      required:
                      - group
                      - name
                      type: object
                    secretKey:
                      type: string
                  required:
                  - remoteRef
                  - secretKey
                  type: object
                type: array
              dataFrom:
                description: Bulk mappings, applied in list order before `data`.
                items:
                  oneOf:
                  - required:
                    - group
                  - required:
                    - extract
                  properties:
                    extract:
                      description: Explode one JSON-object-valued bunker secret into keys.
                      properties:
                        group:
                          type: string
                        name:
                          type: string
                      required:
                      - group
                      - name
                      type: object
                    group:
                      description: 'Whole-group fan-out: each bunker secret name becomes a key.'
                      properties:
                        name:
                          type: string
                        rewrite:
                          items:
                            properties:
                              source:
                                type: string
                              target:
                                type: string
                            required:
                            - source
                            - target
                            type: object
                          type: array
                      required:
                      - name
                      type: object
                  type: object
                type: array
              deletionPolicy:
                default: Retain
                description: What happens to the Secret when this CR is deleted.
                enum:
                - Retain
                - Delete
                type: string
              target:
                description: Target Secret; name defaults to the CR name, type to Opaque.
                nullable: true
                properties:
                  name:
                    nullable: true
                    type: string
                  type:
                    nullable: true
                    type: string
                type: object
            type: object
          status:
            nullable: true
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncTime:
                description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                format: date-time
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              syncedSecretKeys:
                items:
                  type: string
                type: array
              targetSecretName:
                description: Name of the Secret last applied — used to clean up on target rename.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: BunkerSecret
        type: object
    served: true
    storage: true
    subresources:
      status: {}
