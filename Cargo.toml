[package]
name = "secret-bunker-iroh"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
license = "AGPL-3.0-or-later"
description = "Secrets bunker over iroh: p2p QUIC transport, EndpointId ACLs, age at-rest crypto"
repository = "https://github.com/fables-for-robots/secret-bunker-iroh"

[workspace]
members = ["operator"]
resolver = "3"

[dependencies]
age = "0.11"
anyhow = "1"
bech32 = "0.9"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
ed25519-dalek = "3"
iroh = "1"
iroh-mdns-address-lookup = "0.4"
ciborium = "0.2"
rand = "0.8"
ratatui = "0.30"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
