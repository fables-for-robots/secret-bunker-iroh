name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (unit + end-to-end over in-process iroh endpoints)
        run: cargo test

  audit:
    runs-on: ubuntu-latest
    # audit-check reports its results as a check run, which needs an
    # explicitly granted write scope on the default read-only token.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5

      - name: Audit dependencies against the RustSec advisory database
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
